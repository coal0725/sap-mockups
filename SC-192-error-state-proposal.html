<!doctype html>
<!--
  SC-192  오류 · 빈 상태          [신설 · 전 화면 공통]
  삼성표준인증원 SAP 인증심사 플랫폼 개선안 시안
  장은수 · 2026-09-28

  다섯 가지 상태를 한 화면에 둡니다. 서버가 상태 값을 정해 내려줍니다.

    notfound   404   요청한 경로가 없음
    forbidden  403   로그인은 되어 있으나 그 화면을 볼 권한이 없음
    server     500   시스템 오류
    expired    ---   작성 시간 경과로 입력 내용이 사라짐
    maintain   ---   점검 중

  헤더 · 푸터 · 사이드네비를 두지 않았습니다
    오류 화면이 다른 컴포넌트에 의존하면, 그 컴포넌트가 오류의 원인일 때
    오류 화면 자체가 깨집니다. 500 인데 헤더를 그리려다 다시 실패하면 백지가 뜹니다.
    이 화면은 외부 리소스와 스크립트 의존이 없어야 합니다.

    껍데기가 없으므로 로그인 전후를 구분할 필요도 없어집니다.
    비회원 화면과 로그인 뒤 화면에서 같은 파일을 그대로 씁니다.

  문구를 제목 한 줄 · 설명 한 줄로 줄였습니다
    이 화면은 신청 플로우뿐 아니라 로그인 뒤 화면에서도 같은 파일을 씁니다.
    「신청서를 작성하던 중이었다면」 「인증변경은 2시간, 인증심사는 24시간」 같은
    신청 전용 문구를 두면 심사원 · 관리자가 이 화면을 만났을 때 맞지 않습니다.
    상황별 세부 안내는 두지 않고, 무엇을 하면 되는지를 버튼으로만 전달합니다.
    문의처는 화면 아래 한 줄로 둡니다.

  마스코트를 두지 않았습니다
    막힌 사람에게 캐릭터가 웃고 있으면 상황이 가볍게 읽힙니다.
    로고만 두고 문구로 상황을 전달합니다.
    완료 화면(SC-006B · SC-010B)에만 마스코트를 씁니다.

  버튼은 상태마다 다릅니다
    notfound   처음 화면으로
               「이전 화면으로」를 두지 않습니다. 그 404 를 만든 링크로 돌아가면
               다시 404 가 됩니다.
    forbidden  처음 화면으로
    server     다시 시도 · 처음 화면으로
               같은 화면을 다시 불러오면 해결될 수 있으므로 재시도를 남깁니다.
               location.reload() 한 줄이라 공수가 들지 않습니다.
    expired    처음 화면으로
               이어쓸 내용이 없으므로 재시도 버튼을 두지 않습니다.
    maintain   버튼 없음
               누를 수 있는 것이 없는데 버튼을 두면 계속 누릅니다.

  화면에 없는 것 — 의도적으로 넣지 않았습니다
    오류 코드 · 스택 · 요청 ID   기업 화면에 기술 정보를 노출하지 않습니다.
                            서버 로그(NFR-4 감사 로그)에 남기고 화면에는 두지 않습니다.
    401 로그인 필요            오류 화면으로 처리하지 않고 로그인 화면(SC-020)으로 보냅니다.
                            「세션이 만료되어 다시 로그인이 필요합니다」는 그 화면의 안내입니다.
    빈 상태                   목록에 데이터가 없는 경우는 화면마다 문구가 달라
                            (배정된 심사가 없습니다 / 등록된 공지가 없습니다)
                            공통 화면으로 만들 수 없습니다. 각 화면 안의 블록으로 둡니다.
                            SC-007 · SC-008 의 「조회 결과 없음」이 그 예입니다.
    자동 새로고침              점검이 끝나는 시점을 알 수 없으므로 기업이 직접 누르게 합니다.
    점검 예정 시각              점검은 예정보다 길어지는 일이 흔하므로 시각을 쓰지 않습니다.
                            「04:00 종료 예정」이라 적어 두면 05:00 에 끝났을 때
                            그 사이 들어온 기업은 틀린 정보를 본 것이 됩니다.
                            SC-010B 에서 「O일 이내 연락」을 쓰지 않은 것과 같은 판단입니다.
                            급한 기업은 화면 아래 연락처로 문의할 수 있습니다.
    웹폰트                    외부 CDN 에 의존하지 않도록 시스템 폰트만 씁니다.
                            다른 시안과 글꼴이 조금 다르게 보이는 것은 의도한 것입니다.

  서버에서 정해 주실 것
    상태 값      notfound · forbidden · server · expired · maintain 다섯 가지로 내려 주십시오.
                표시 문자열로 조건 분기하지 마십시오. 이 값 하나만 내려 주시면 됩니다.

  시안 확인용 동작
    화면 하단의 검은 막대에서 상태를 고르실 수 있습니다.
    그 막대는 시안 확인용이며 구현 대상이 아닙니다.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="https://ssr1.co.kr/assets/site/img/common/favicon.ico">
<title>안내 | 삼성표준인증원</title>
<style>
  :root{
    --navy:#1A2A4F; --navy-soft:#E9ECF3;
    --ink:#1A1D1B; --muted:#6B706C; --line:#E2E3DE;
    --bg:#F7F7F4; --card:#FFFFFF;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;
       font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic','맑은 고딕',
                   'Apple SD Gothic Neo',system-ui,sans-serif;
       background:var(--bg); color:var(--ink);
       -webkit-font-smoothing:antialiased;
       min-height:100vh; display:flex; flex-direction:column;
       align-items:center; justify-content:center;
       padding:40px 20px 96px; text-align:center}

  .logo{height:34px; width:auto; display:block; margin:0 auto 34px; opacity:.9}

  h1{margin:0 0 12px; font-size:26px; font-weight:700;
     letter-spacing:-.02em; line-height:1.36; max-width:640px}
  .sub{margin:0; font-size:15.5px; color:var(--muted); line-height:1.7; max-width:520px}

  .act{margin:32px 0 0; display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
  .btn{font-size:15px; font-weight:600; padding:13px 22px; border-radius:9px;
       border:1px solid #C9CCC6; background:var(--card); color:var(--ink);
       cursor:pointer; transition:border-color .18s ease, background .18s ease}
  .btn:hover{border-color:var(--navy)}
  .btn.p{background:var(--navy); border-color:var(--navy); color:#fff}
  .btn.p:hover{background:#142139}

  .tel{margin:34px 0 0; font-size:13px; color:var(--muted); line-height:1.8}
  .tel b{color:var(--ink); font-weight:600}

  /* 시안 확인용 — 구현 대상이 아닙니다 */
  .demo{position:fixed; left:0; right:0; bottom:0; z-index:40; background:#131313;
        display:flex; align-items:center; justify-content:center;
        gap:8px; padding:11px 16px; flex-wrap:wrap}
  .demo-l{font-size:12px; color:#8C918C; margin-right:4px}
  .demo button{font-size:13px; padding:8px 13px; border-radius:7px;
               border:1px solid #3A3D3A; background:#1F211F; color:#D6D9D6;
               cursor:pointer; transition:background .16s ease}
  .demo button:hover{background:#2A2D2A}
  .demo button.on{background:#fff; color:#131313; border-color:#fff; font-weight:700}

  @media (max-width:560px){
    body{padding:32px 16px 118px}
    .logo{height:29px; margin-bottom:28px}
    h1{font-size:21px}
    .sub{font-size:14.5px}
    .btn{width:100%; max-width:320px}
    .act{gap:9px}
    .demo{gap:6px; padding:9px 12px}
    .demo button{font-size:12px; padding:7px 10px}
  }
</style>
</head>
<body>

<img class="logo" src="assets/ssr-logo.svg" alt="삼성표준인증원" width="187" height="34">

<h1 id="e-t">요청하신 페이지를 찾을 수 없습니다</h1>
<p class="sub" id="e-s">주소가 바뀌었거나 삭제된 페이지입니다.</p>

<div class="act" id="e-a"></div>

<p class="tel">
  문의 &nbsp;<b>02-6951-2009</b>&nbsp; · &nbsp;<b>ssr@ssr1.co.kr</b>
</p>

<div class="demo">
  <span class="demo-l">시안 확인용</span>
  <button type="button" data-st="notfound" class="on">404 페이지 없음</button>
  <button type="button" data-st="forbidden">403 권한 없음</button>
  <button type="button" data-st="server">500 시스템 오류</button>
  <button type="button" data-st="expired">작성 시간 경과</button>
  <button type="button" data-st="maintain">점검 중</button>
</div>

<script>
/* 상태별 문구 · 버튼 — 실제로는 서버가 내려주는 상태 값으로 갈립니다 */
(function(){
  var HOME = 'SC-001-welcome-proposal.html';

  var ST = {
    notfound: {
      t: '요청하신 페이지를 찾을 수 없습니다',
      s: '주소가 바뀌었거나 삭제된 페이지입니다.',
      a: [['처음 화면으로', 'p', 'home']]
    },
    forbidden: {
      t: '접근 권한이 없습니다',
      s: '현재 계정으로는 이 화면을 보실 수 없습니다.',
      a: [['처음 화면으로', 'p', 'home']]
    },
    server: {
      t: '일시적인 오류가 발생했습니다',
      s: '잠시 후 다시 시도해 주십시오.',
      a: [['다시 시도', 'p', 'reload'], ['처음 화면으로', '', 'home']]
    },
    expired: {
      t: '작성 시간이 지났습니다',
      s: '작성 중이던 내용은 저장되지 않았습니다. 처음부터 다시 진행해 주십시오.',
      a: [['처음 화면으로', 'p', 'home']]
    },
    maintain: {
      t: '시스템 점검 중입니다',
      s: '점검이 끝나면 정상적으로 이용하실 수 있습니다.',
      a: []
    }
  };

  var t = document.getElementById('e-t'),
      s = document.getElementById('e-s'),
      a = document.getElementById('e-a');

  function render(k){
    var d = ST[k];
    if (!d) return;
    t.textContent = d.t;
    s.textContent = d.s;
    a.innerHTML = '';
    d.a.forEach(function(b){
      var el = document.createElement('button');
      el.type = 'button';
      el.className = 'btn' + (b[1] ? ' ' + b[1] : '');
      el.textContent = b[0];
      el.addEventListener('click', function(){
        if (b[2] === 'home') location.href = HOME;
        else location.reload();
      });
      a.appendChild(el);
    });
    document.documentElement.setAttribute('data-err', k);
  }

  document.querySelectorAll('.demo button').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.demo button').forEach(function(x){ x.classList.remove('on'); });
      btn.classList.add('on');
      render(btn.getAttribute('data-st'));
    });
  });

  render('notfound');
})();
</script>

</body>
</html>
